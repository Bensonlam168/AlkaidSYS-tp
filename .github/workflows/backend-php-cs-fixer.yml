name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'releases/*'
      - 'feature/*'

jobs:
  # ============================================================================
  # Job 1: PHP Code Style Check (PSR-12)
  # ============================================================================
  php-cs-fixer:
    name: PHP Code Style Check (PSR-12)
    runs-on: ubuntu-latest
    if: github.repository == 'Bensonlam168/AlkaidSYS-tp'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, redis, mbstring, xml, bcmath, sockets, openssl, curl, fileinfo
          tools: php-cs-fixer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # `--no-scripts` 是必须的：composer.json 的 post-autoload-dump 是
      #   ["@php think service:discover", "@php think vendor:publish"]
      # 也就是说 **`composer install` 会启动应用**。而安装发生在写 .env 之前，
      # 此刻 env('APP_ENV') 回落 'production'、env('REDIS_HOST') 回落 docker-compose
      # 的服务名 'redis'（见 config/cache.php:42 与 RedisHealthCheckService 的默认值），
      # runner 上 'redis' 不是可解析主机名，于是 RedisHealthCheckService::boot()
      # 直接抛异常 → post-autoload-dump 以 1 结束 → composer install 失败。
      # 实测 CI 日志（修复前）：
      #   Redis health check failed (host=redis, port=6379):
      #     getaddrinfo for redis failed: Temporary failure in name resolution
      #   Script @php think service:discover handling the post-autoload-dump event
      #     returned with error code 1
      #
      # 装依赖不是启动应用：cs-fixer 只解析语法树，不需要 App::initialize()。
      # 因此本 job 既不需要 .env，也不需要显式 service:discover，更不需要任何 service。
      - name: Install dependencies (no scripts)
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-swoole --no-scripts

      - name: PHP-CS-Fixer dry-run (backend)
        run: |
          ./vendor/bin/php-cs-fixer fix --dry-run --diff

  # ============================================================================
  # Job 2: Language Pack Consistency Check (i18n)
  # ============================================================================
  lang-check:
    name: Language Pack Consistency Check (i18n)
    runs-on: ubuntu-latest
    if: github.repository == 'Bensonlam168/AlkaidSYS-tp'
    # 【刻意不写 needs —— 请勿"优化"回去】
    # 这里曾经是 needs: php-cs-fixer。而本 check 是 AGENTS.md 明列的 required
    # status check（`Language Pack Consistency Check (i18n)`）。required 的语义是
    # 「必须出现且为 success」：一旦上游 php-cs-fixer 恒红（当前仓库就是如此），
    # 本 job 会以 skipped 收场，PR 就永远等不到这个 check 的结论而被卡死 ——
    # 与 R40 修掉的「带 paths 过滤的 required check 永久 Expected」是同一类故障。
    # 语言包一致性与代码风格正交，两者并行运行，各自独立作为 required check。

    # ------------------------------------------------------------------------
    # 依赖服务：只要 redis，**不要** MySQL
    # ------------------------------------------------------------------------
    # 为什么必须有 redis：
    #   config/session.php 把 type/store **硬编码**成 'cache' + 'redis'，
    #   于是 RedisHealthCheckService::boot() 里的 $usesRedisSession 恒为 true ——
    #   自检**无条件**执行，与 APP_ENV、CACHE_DRIVER 都无关
    #   （即使 cache.default 已经是 file，照样会走 Redis 自检）。
    #   缺 Redis 时 boot 直接抛异常，任何 php think 命令都起不来。
    # 为什么不需要 MySQL：
    #   `php think lang:check` 只读 app/lang/**，不碰数据库。
    #   实测（Redis 可达 + DB_HOST 指向不可解析主机）→ EXIT=0。
    #   因此不挂 MySQL，省掉一次 service 启动。
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # ------------------------------------------------------------------------
    # 为什么不再用 `docker compose -f docker-compose.yml up -d backend`
    # ------------------------------------------------------------------------
    # 那条路径要先 `docker build`，而 Dockerfile 第 5 层的
    #   RUN composer dump-autoload --optimize --no-dev --no-interaction
    # 会触发 post-autoload-dump → `php think service:discover`。
    # 构建期既没有 .env（.dockerignore 里被排除）也没有名为 'redis' 的主机，
    # 于是**镜像构建本身**失败。实测 CI 日志（修复前）：
    #   #22 [stage-0 10/10] RUN composer dump-autoload --optimize ...
    #   #22 0.923 [RuntimeException]
    #   #22 0.923 Redis health check failed (host=redis, port=6379):
    #   #22 0.923   getaddrinfo for redis failed: Name or service not known
    #   #22 0.933 Script @php think service:discover handling the post-autoload-dump
    #   #22 0.933   event returned with error code 1
    #   ERROR: process "/bin/sh -c composer dump-autoload ..." did not complete successfully
    # 即：这条 job 的红**不在 workflow 里，而在 Dockerfile 里**，本文件改不动它。
    # 改成在 runner 上直接跑 PHP：不依赖镜像、不依赖 Dockerfile，
    # 且与同类 job（phpunit / migration-data-check）保持同一套安装参数。
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, redis, mbstring, xml, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # 同 php-cs-fixer job：安装期不得启动应用（理由见该 job 的注释）。
      - name: Install dependencies (no scripts)
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-swoole --no-scripts

      - name: Create .env for the redis service container
        # .env.example 的键值行**带空格**（形如 `DB_HOST = mysql`），
        # 所以必须用「键名 + 可选空白 + =」匹配。写成 `s/REDIS_HOST=.*/` 一个都匹配不上，
        # sed 会**静默不生效**（phpunit job 里曾经如此，DB_HOST 一直停在 `mysql`）。
        # 另外 .env.example 里**没有** REDIS_HOST 这一行，sed 无从匹配，只能追加。
        run: |
          cp .env.example .env
          sed -i -E 's|^REDIS_HOST[[:space:]]*=.*|REDIS_HOST = 127.0.0.1|' .env
          grep -qE '^REDIS_HOST[[:space:]]*=' .env || echo 'REDIS_HOST = 127.0.0.1' >> .env
          # 断言：没生效就立刻失败，而不是等到 lang:check 报一个看不懂的连接错误
          grep -qx 'REDIS_HOST = 127.0.0.1' .env
          # .env 必须能被 parse_ini_file 解析（注释里的半角括号/等号会让整份文件静默失效）
          php -r 'var_dump(parse_ini_file(".env", true, INI_SCANNER_RAW) !== false);' | grep -qx 'bool(true)'

      # 与 phpunit / migration-data-check 两个 job 保持同一顺序：
      # 安装(--no-scripts) → 写 .env → **显式** service:discover → 业务命令。
      # service:discover 这一步同时是「应用能正常启动」的自检：
      # .env 里的 REDIS_HOST 写错时它会以非 0 退出（RedisHealthCheckService 是 fail-closed 的），
      # 而不是把问题拖到 lang:check 之后才以别的面目出现。
      - name: Discover services (explicit, after .env)
        run: php think service:discover

      - name: Check language pack consistency
        run: |
          php think lang:check || {
            echo "❌ Language pack consistency check failed"
            echo "Please run the following commands locally:"
            echo "  docker compose up -d backend"
            echo "  docker exec -it alkaid-backend php think lang:sync --write"
            echo "Then translate TODO: markers and commit the changes."
            exit 1
          }

  # ============================================================================
  # Job 3: PHPUnit Tests
  # ============================================================================
  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    if: github.repository == 'Bensonlam168/AlkaidSYS-tp'
    # ========================================================================
    # 【刻意不写 needs（等价于 needs: []）—— 请勿"优化"回去】
    #
    # 这里曾经是 needs: [php-cs-fixer, lang-check]，后果是「顺序阻断」：
    #   1. php-cs-fixer 对全仓做 --dry-run，只要有一个文件可格式化就 exit 非 0。
    #      实测：仅 app/ 82 个文件里就有 9 个需要修复（全仓 922 个文件更多），
    #      所以该 job 在当前仓库状态下**必然失败**。
    #   2. php-cs-fixer 一失败，本 job 就被 GitHub 判定为 skipped —— PHPUnit
    #      从来没在这里真正跑过，测试信号完全丢失（"CI 绿"与"测试通过"脱钩）。
    #   3. lang-check 自身也写着 needs: php-cs-fixer，跳过会沿依赖链向下传递，
    #      所以只保留 needs: [lang-check] 同样救不回测试，必须整个去掉。
    #
    # 判断依据：代码风格与测试是**两个独立的质量维度**。风格不合规不应导致
    # 测试结果不可见；测试失败也不应掩盖风格问题。两者各自作为独立门禁并行运行，
    # 需要"都通过才能合并"时，请用分支保护的 required status checks 表达，
    # 而不是用 job 之间的 needs 串成一条链。
    # php-cs-fixer job 仍然保留（同名 job，独立门禁），只是不再作为本 job 的前置。
    #
    # 依据：docs/superpowers/plans/2026-10-31-phase-a-verification-baseline.md Task A2（ER-16）
    # ========================================================================

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alkaid_sys_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, redis, mbstring, xml, bcmath
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # `--no-scripts`：安装期不得启动应用（详细理由见 php-cs-fixer job 的注释）。
      # 正确的顺序是「安装(--no-scripts) → 写 .env → 显式 service:discover → migrate → test」，
      # 这样应用第一次启动时 .env 已经就绪，DB/Redis 都指向 127.0.0.1 上的 service 容器。
      - name: Install dependencies (no scripts)
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-swoole --no-scripts

      - name: Create .env file
        # 原写法 `sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/'` 是**静默失效**的：
        # .env.example 的键值行带空格（`DB_HOST = mysql`），而模式里要求 `DB_HOST=` 紧贴，
        # 于是一个都匹配不上，测试仍然去连主机名 `mysql` —— runner 上不可解析，
        # 报出来的是「连接失败」而不是「配置没写对」，极难定位。
        # 另外 .env.example 里根本没有 REDIS_HOST，sed 无从匹配，只能追加。
        # 统一改成「键名 + 可选空白 + =」，并在末尾用 grep 断言真的改到了。
        run: |
          cp .env.example .env
          sed -i -E 's|^DB_HOST[[:space:]]*=.*|DB_HOST = 127.0.0.1|' .env
          sed -i -E 's|^DB_NAME[[:space:]]*=.*|DB_NAME = alkaid_sys_test|' .env
          sed -i -E 's|^DB_USER[[:space:]]*=.*|DB_USER = root|' .env
          sed -i -E 's|^DB_PASS[[:space:]]*=.*|DB_PASS = root|' .env
          sed -i -E 's|^REDIS_HOST[[:space:]]*=.*|REDIS_HOST = 127.0.0.1|' .env
          grep -qE '^REDIS_HOST[[:space:]]*=' .env || echo 'REDIS_HOST = 127.0.0.1' >> .env
          # 断言：任何一条没生效都立刻失败，而不是等到 migrate:run 报一个看不懂的连接错误
          grep -qx 'DB_HOST = 127.0.0.1' .env
          grep -qx 'DB_NAME = alkaid_sys_test' .env
          grep -qx 'DB_USER = root' .env
          grep -qx 'REDIS_HOST = 127.0.0.1' .env
          # .env 必须能被 parse_ini_file 解析（注释里的半角括号/等号会让整份文件静默失效）
          php -r 'var_dump(parse_ini_file(".env", true, INI_SCANNER_RAW) !== false);' | grep -qx 'bool(true)'

      # composer install 已用 --no-scripts，post-autoload-dump 原本做的服务发现被移到这里。
      # 不要删掉这一步：它负责生成 vendor/services.php（think-queue / think-swoole /
      # think-trace / think-migration 这些**包级** service 的清单），
      # 缺它测试会跑在一个与 composer install 默认行为不同的应用状态下。
      # 这一步同时是 fail-closed 的启动自检：.env 里 REDIS_HOST 写错时它直接以非 0 退出。
      - name: Discover services (explicit, after .env)
        run: php think service:discover

      - name: Wait for MySQL to be ready
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -uroot -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      # 迁移失败必须阻断，不设 continue-on-error：
      # 测试库 schema 与迁移脚本不一致时，后续用例的失败是"结构性假失败"——
      # 看起来是业务代码坏了，实际是库没建好，排查成本远高于直接红。
      # 全新 MySQL 上 migrate:run 冷启动已验证可用（35 迁移 / 29 表），
      # 因此不需要用 continue-on-error 兜底"可能连不上库"这种历史顾虑。
      - name: Run database migrations
        run: php think migrate:run

      # 迁移只建 schema 与 19 条系统权限，**不建**角色 / 系统用户 / 业务权限（R50）。
      # 冷启动后若直接跑测试，状态是 permissions=19 / roles=0 / users=0 / sites=0，
      # 而 tests/Helpers/AuthHelper 硬编码了 userId=1（admin），于是所有「以 admin 身份
      # 访问受保护接口」的用例都以「缺种子数据」失败（实测 554 用例里 20+ 条）。
      # 这些是**数据**不是 schema，按「数据归 seeder、schema 归迁移」的分工放在 seeder 里；
      # 这里用 -s 只跑测试专用 seeder：
      #   1. 创建 id=1 的系统用户，口令字段是随机不可用哈希（测试只校验 JWT，不需要口令），
      #      因此本步骤**不需要** ADMIN_INIT_PASSWORD 之类的口令环境变量；
      #   2. 创建 roles 1/2、业务权限 33 条（显式 id 1001..1033，含 workflow_* 10 条）、角色授权、默认站点；
      #   3. 幂等：重复执行插 0 行，不覆盖已有数据。
      # 为什么不用 `php think seed:run`（不带 -s）：那会连 CorePlatformSeed 一起跑，
      # 而它按设计要求显式提供 ADMIN_INIT_PASSWORD，缺失即失败（R43 的口令策略，不该为 CI 放宽）。
      - name: Seed test fixtures
        run: php think seed:run -s TestPlatformSeed

      # Unit 与 Feature 拆成两个 step（而不是 --testsuite=Unit 再跟 Feature）：
      # app/command/TestCommand.php:184 的 --testsuite 是单值选项，不支持重复传参，
      # 拆开还能让失败定位到具体是哪个套件。
      # 两个 step 都不加 continue-on-error / || true：Feature 失败就是要让 job 失败，
      # 把真实失败掩盖成绿色比没有这个 step 更糟。
      - name: Run PHPUnit tests (Unit)
        run: php think test --testsuite=Unit
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_NAME: alkaid_sys_test
          DB_USER: root
          DB_PASS: root
          REDIS_HOST: 127.0.0.1

      - name: Run PHPUnit tests (Feature)
        run: php think test --testsuite=Feature
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_NAME: alkaid_sys_test
          DB_USER: root
          DB_PASS: root
          REDIS_HOST: 127.0.0.1

      # 跑**整个 Legacy 套件**，不是按类名 filter 某一个类：
      #   1. 套件里现在有两个守卫（LegacyCollectionUsageGuardTest /
      #      WithoutTenantScopeUsageGuardTest），filter 一个类就只能守住一半；
      #   2. 以后新增守卫只要落进 tests/Legacy，这里自动生效，不必再改工作流。
      #
      # 上一版的写法是 php think test --filter=LegacyCollectionUsageGuardTest，
      # 而 tests/Legacy 当时**不在任何 testsuite 里** —— PHPUnit 只认 phpunit.xml 登记的套件，
      # 于是这条步骤匹配不到任何用例，打印 No tests executed! 之后仍然 exit 0，
      # 两个守卫长期空转（「已纳入 CI」是假的）。
      # 现在两道防线同时生效：phpunit.xml 里登记了 Legacy 套件（能跑到），
      # 且开了 failOnEmptyTestSuite（跑不到就以 1 结束，不会再假绿）。
      #
      # 与上面两条 step 不重复：本 job 的 Unit / Feature 是分开的套件，
      # 全量 php think test（不带 --testsuite）才会把三个套件一起跑一遍。
      - name: Run Legacy guard suite
        run: php think test --testsuite=Legacy
        env:
          APP_ENV: testing

      - name: Verify route documentation (T-060)
        run: php think route:verify
        env:
          APP_ENV: testing

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            runtime/log/
          retention-days: 7
