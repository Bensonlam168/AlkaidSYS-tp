name: Docs Check

# 文档一致性门禁 | Documentation consistency gate
#
# 检查 design/ 与 docs/ 下的 Markdown，**以及 SCAN_FILES 登记的根目录文档**
# （AGENTS.md / CLAUDE.md / README.md / README.local.md）：
#   0. 扫描范围完整性（根目录 md 既未纳入扫描也未豁免 → 报错）
#   1. 链接失效：相对 .md 链接指向不存在的文件（含裸相对链接，按所在目录解析）；
#      `file://` 本机绝对路径判错（他人无法打开）
#   2. 代码围栏配平
#   3. 示例代码引用不存在的类（已声明「设计阶段命名」的文档豁免）
#
# 检查 1 会先剥离围栏代码块与行内代码，避免把「描述链接规则的说明文字」误报为失效链接。
# 详情见 scripts/check-docs.php

# R40：刻意**不再声明** `paths:` 过滤 | No `paths:` filter on purpose
#
# 为什么去掉：本门禁要被合并前规则设为 required status check 才能阻止合并，而 GitHub 对
#   「声明了 paths: 且本次 PR 未命中这些路径」的工作流，会一直显示
#   `Expected — Waiting for status to be reported` 且永不结束 —— 未命中路径的 PR 反而
#   因此永久无法合并（详见 AGENTS.md「合并前必须通过的配置类门禁」）。
# 代价：每个 PR 都会跑一遍。本门禁是秒级纯静态校验（只读 Markdown / PHP 源码，无 DB、无网络），
#   几分钟的差额可以忽略；换来的是「可以安全地设为 required」。
# 历史：此前 pull_request 与 push 都带 paths:（`design/**/*.md`、`docs/**/*.md`、
#   `scripts/check-docs.php`），仅用于省 CI 分钟数。

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  docs-check:
    name: Documentation Consistency
    runs-on: ubuntu-latest
    if: github.repository == 'Bensonlam168/AlkaidSYS-tp'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Run docs consistency check
        # --strict：发现问题即返回非 0，阻止合并
        run: php scripts/check-docs.php --strict
