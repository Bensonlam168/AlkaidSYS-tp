name: Env Example Check

# .env.example 配置门禁 | Environment example gate
#
# .env.example 有两个「改坏了也不报错」的坑，都曾真实发生并极难定位：
#   1. `#` 注释行里的半角括号/引号会让 parse_ini_file 直接返回 false
#      → ThinkPHP Env::load() 按 `?: []` 兜底 → 整份 .env 的键静默失效
#      → 表现为「容器正常启动，但所有数据库操作 Connection refused」
#   2. `#` 注释行里的半角 `=` 会被解析成伪键（键名形如 `# 1. 生产类环境（APP_ENV`）
#
# 本工作流跑 scripts/check-env-example.php，覆盖：
#   A. 可解析（失败时给出语法错误行号与原文）
#   B. 无伪键
#   C. 注释行无 ASCII 括号/引号
#   D0. catalog 的模板必需键清单「非空且键名合法」（fail-closed，检查 D 的前置断言）
#   D. 必需键存在（键清单来自 app/support/EnvRequirementCatalog::templateRequiredKeys()）
#   E. .env.production.example 覆盖 .env.example 的键集合
#   F. 本地 .env 键集合对比（提示项，不参与门禁）
#
# 零依赖是硬要求（本 check 是 required status check）| Zero-dependency on purpose
#
# 检查 D 读的是 EnvRequirementCatalog::templateRequiredKeys()（**刻意的单一真相源**）。
# 单一真相源的反面是「门禁自己看不见自己被废掉」，所以三类失效必须各有归属：
#   1. **键名漂移**（catalog 里把 DB_HOST 写成 DB_HOSTX）→ 检查 D 自己就红：
#      它拿 catalog 的清单去两份模板里逐个找，找不到就是 [MISSING-KEY]。不需要用例来兜。
#   2. **清单被清空**（template_required 全改 false / 整表删掉）→ 检查 D 会遍历 0 个键、
#      打印 OK 后原地保持绿色。这一类静默缺口由**脚本内的 fail-closed 断言**覆盖：
#      检查 D0 要求 templateRequiredKeys() 非空、且每个键名匹配 ^[A-Z][A-Z0-9_]*$，
#      不满足就 exit(1) 并跳过检查 D / E / F。
#   3. **键集合被钉死**（清单仍合法非空，但少了几个键，例如删掉 DB_CHARSET 那一条）→
#      静态脚本判不了：它只知道「清单里有这些」，无从判断「本该还有哪些」。
#      这一层由 Backend CI 的 Unit 套件里的
#      tests/Unit/Scripts/EnvExampleTemplateRequiredConsistencyTest 覆盖
#      （testTemplateRequiredKeysArePinned 钉死 6 键及其顺序；
#        testEveryKeyHasAnExplicitTemplateDecision 钉住「每个生产必需键都得显式表态」）。
#
# 历史（为什么这里**不再**跑 PHPUnit）：本 job 曾为第 2 条加过
#   `composer install` + `./vendor/bin/phpunit tests/Unit/Scripts/EnvExampleTemplateRequiredConsistencyTest.php`。
#   代价是：一个 required check 从此依赖 packagist，网络抖动即阻塞合并，而它挡的正是第 2 条。
#   第 2 条移进脚本后（零依赖、毫秒级），那两个步骤随之移除 —— 本 job 回到
#   「checkout -> 装 PHP -> 跑脚本」三步。
#   注意：第 3 条**不在**本 job 的覆盖范围内，也不在 AGENTS.md 的 required check 表内 ——
#         它是「有 CI 会跑、但不是合并阻断项」的已登记风险，别把这段注释读成「全都守住了」。

# R40：刻意**不再声明** `paths:` 过滤 | No `paths:` filter on purpose
#
# 为什么去掉：本门禁要被合并前规则设为 required status check 才能阻止合并，而 GitHub 对
#   「声明了 paths: 且本次 PR 未命中这些路径」的工作流，会一直显示
#   `Expected — Waiting for status to be reported` 且永不结束 —— 未命中路径的 PR 反而
#   因此永久无法合并（详见 AGENTS.md「合并前必须通过的配置类门禁」）。
# 代价：每个 PR 都会跑一遍。
# 历史：此前 pull_request 与 push 都带 paths:（`.env.example`、`scripts/check-env-example.php`、
#   本工作流自身、`AGENTS.md` —— 后者因为规则原文与自查命令写在那里，规则变更时应连带复跑）。
# 仍然**不能**加回 paths:：任何一个 PR 不触发，required check 就会永久 Expected。
# （本 job 已不跑用例，但「对每个 PR 都要给出结论」这条约束不变。）

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  env-example-check:
    name: Env Example Consistency
    runs-on: ubuntu-latest
    if: github.repository == 'Bensonlam168/AlkaidSYS-tp'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # 只钉版本，不装扩展：脚本只用 PHP 内置函数（parse_ini_file / preg_* / realpath），
          # 也不 require vendor/autoload.php —— 本步骤是纯静态、秒级、不联网。
          php-version: '8.2'
          coverage: none

      - name: Run .env.example consistency check
        # --strict：注释里的软字符（' 与 ]）也只提示不允许通过，与 AGENTS.md 规则对齐
        run: php scripts/check-env-example.php --strict
