# 前端CI/CD工作流
name: Frontend CI/CD

on:
  pull_request:
    branches: [ main, develop ]
    paths: [ 'frontend/**' ]
  push:
    branches: [ main, develop ]
    paths: [ 'frontend/**' ]

# 环境变量
env:
  NODE_VERSION: '18'
  PNPM_VERSION: '9.15.5'

jobs:
  # 前端代码质量检查
  frontend-quality:
    name: 前端代码质量检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 安装pnpm
        run: |
          corepack enable
          pnpm --version
      
      - name: 缓存pnpm依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: 安装依赖
        run: |
          cd frontend
          pnpm install --frozen-lockfile
      
      - name: ESLint检查
        run: |
          echo "🔍 执行ESLint检查..."
          cd frontend
          pnpm lint
          if [ $? -ne 0 ]; then
            echo "❌ ESLint检查失败"
            exit 1
          fi
          echo "✅ ESLint检查通过"
      
      - name: Prettier格式检查
        run: |
          echo "🎨 执行Prettier格式检查..."
          cd frontend
          pnpm prettier --check .
          if [ $? -ne 0 ]; then
            echo "❌ Prettier格式检查失败"
            exit 1
          fi
          echo "✅ Prettier格式检查通过"
      
      - name: Stylelint检查
        run: |
          echo "🎨 执行Stylelint检查..."
          cd frontend
          pnpm stylelint "**/*.{vue,css,less,scss}"
          if [ $? -ne 0 ]; then
            echo "❌ Stylelint检查失败"
            exit 1
          fi
          echo "✅ Stylelint检查通过"
      
      - name: TypeScript类型检查
        run: |
          echo "📝 执行TypeScript类型检查..."
          cd frontend
          pnpm typecheck
          if [ $? -ne 0 ]; then
            echo "❌ TypeScript类型检查失败"
            exit 1
          fi
          echo "✅ TypeScript类型检查通过"

  # 前端单元测试
  frontend-tests:
    name: 前端单元测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 安装pnpm
        run: |
          corepack enable
          pnpm --version
      
      - name: 缓存pnpm依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: 安装依赖
        run: |
          cd frontend
          pnpm install --frozen-lockfile
      
      - name: 运行单元测试
        run: |
          echo "🧪 运行前端单元测试..."
          cd frontend
          pnpm test:unit
          if [ $? -ne 0 ]; then
            echo "❌ 前端单元测试失败"
            exit 1
          fi
          echo "✅ 前端单元测试通过"
      
      - name: 上传测试覆盖率
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true

  # 前端构建
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: [frontend-quality, frontend-tests]
    
    strategy:
      matrix:
        app: [antd, naive, tdesign, ele]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 安装pnpm
        run: |
          corepack enable
          pnpm --version
      
      - name: 缓存pnpm依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: 安装依赖
        run: |
          cd frontend
          pnpm install --frozen-lockfile
      
      - name: 构建前端应用
        run: |
          echo "🔨 构建前端应用 (${{ matrix.app }})..."
          cd frontend
          pnpm build:${{ matrix.app }}
          if [ $? -ne 0 ]; then
            echo "❌ 前端构建失败 (${{ matrix.app }})"
            exit 1
          fi
          echo "✅ 前端构建成功 (${{ matrix.app }})"
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.app }}
          path: frontend/dist/
          retention-days: 7

  # 前端部署（仅main分支）
  frontend-deploy:
    name: 前端部署
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-antd
          path: frontend/dist/
      
      - name: 部署到生产环境
        run: |
          echo "🚀 部署前端到生产环境..."
          # 这里可以添加实际的部署脚本
          # 例如：上传到CDN、部署到服务器等
          echo "✅ 前端部署完成"

  # 前端性能测试
  frontend-performance:
    name: 前端性能测试
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-antd
          path: frontend/dist/
      
      - name: 安装Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
      
      - name: 运行Lighthouse性能测试
        run: |
          echo "⚡ 运行Lighthouse性能测试..."
          cd frontend
          lhci autorun
          if [ $? -ne 0 ]; then
            echo "❌ Lighthouse性能测试失败"
            exit 1
          fi
          echo "✅ Lighthouse性能测试通过"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      
      - name: 上传Lighthouse报告
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/