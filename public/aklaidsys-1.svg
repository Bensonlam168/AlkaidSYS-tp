<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 611.95 682.12">
  
  <defs>
    <linearGradient id="grad_main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#005EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A020F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_aux" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E066FF;stop-opacity:1" />
    </linearGradient>
    
    <filter id="jelly3d" x="-50%" y="-50%" width="200%" height="200%">
      <!-- 1. Drop Shadow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="dropShadow"/>
      
      <!-- 2. Specular Highlight (Glossy Shine) -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur2"/>
      <feSpecularLighting in="blur2" surfaceScale="5" specularConstant="0.8" specularExponent="15" lighting-color="#ffffff" result="specOut">
        <fePointLight x="100" y="100" z="200"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOutMasked"/>
      
      <!-- 3. Inner Light (Top-Left Edge) - Optional, but adds to 3D feel -->
      <!-- Using a second specular light or just relying on the first one -->
      
      <!-- Merge: Shadow + Graphic + Highlight -->
      <feMerge>
        <feMergeNode in="dropShadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="specOutMasked"/>
      </feMerge>
    </filter>
    
    <!-- A subtler filter for the rocket/stars if needed, or just use the same one? -->
    <!-- Let's define a smaller scale one for small items -->
    <filter id="jelly3d_small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="1" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="dropShadow"/>
      
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur2"/>
      <feSpecularLighting in="blur2" surfaceScale="3" specularConstant="1" specularExponent="10" lighting-color="#ffffff" result="specOut">
        <fePointLight x="100" y="100" z="100"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOutMasked"/>
      
      <feMerge>
        <feMergeNode in="dropShadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="specOutMasked"/>
      </feMerge>
    </filter>
  </defs>
    
