# GitHub Actions工作流：分支保护与代码质量检查
name: Branch Protection and Code Quality

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main, develop ]

# 环境变量
env:
  NODE_VERSION: '18'
  PHP_VERSION: '8.2'

jobs:
  # 代码质量检查作业
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 安装后端依赖
        run: |
          docker compose up -d
          docker exec -it alkaid-backend composer install --optimize-autoloader
      
      - name: 安装前端依赖
        run: |
          cd frontend
          corepack enable
          pnpm install
      
      - name: PHP代码风格检查
        run: |
          echo "🔍 执行PHP代码风格检查..."
          docker exec alkaid-backend ./vendor/bin/php-cs-fixer fix --dry-run --diff
          if [ $? -ne 0 ]; then
            echo "❌ PHP代码风格检查失败"
            exit 1
          fi
          echo "✅ PHP代码风格检查通过"
      
      - name: 前端代码风格检查
        run: |
          echo "🔍 执行前端代码风格检查..."
          cd frontend
          pnpm lint
          if [ $? -ne 0 ]; then
            echo "❌ 前端代码风格检查失败"
            exit 1
          fi
          echo "✅ 前端代码风格检查通过"
      
      - name: 提交信息规范检查
        run: |
          echo "🔍 检查提交信息规范..."
          # 检查最新提交信息是否符合规范
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ ! "$COMMIT_MSG" =~ ^(feat|fix|docs|refactor|test|chore|perf|style)\([a-z]+\): .+\(T-[0-9]+\).*$ ]]; then
            echo "❌ 提交信息格式不符合规范"
            echo "期望格式: type(scope): description (T-XXX)"
            echo "实际格式: $COMMIT_MSG"
            exit 1
          fi
          echo "✅ 提交信息规范检查通过"

  # 安全扫描作业
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 运行安全扫描
        run: |
          echo "🔒 执行安全扫描..."
          
          # 检查敏感信息泄露
          echo "检查敏感信息泄露..."
          if grep -r -E "(password|secret|key|token).*=.*['\"]" --include="*.php" --include="*.env*" --exclude-dir=vendor --exclude-dir=node_modules .; then
            echo "❌ 发现可能的敏感信息泄露"
            exit 1
          fi
          
          # 检查SQL注入风险
          echo "检查SQL注入风险..."
          if grep -r -E "(\$_GET|\$_POST|\$_REQUEST)" --include="*.php" --exclude-dir=vendor .; then
            echo "⚠️  发现直接使用超全局变量的代码，可能存在SQL注入风险"
          fi
          
          echo "✅ 安全扫描完成"

  # 后端测试作业
  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 启动服务
        run: |
          echo "🚀 启动Docker服务..."
          docker compose up -d
          sleep 30
      
      - name: 运行后端测试
        run: |
          echo "🧪 运行后端测试..."
          docker exec alkaid-backend php think test --testsuite=Feature
          if [ $? -ne 0 ]; then
            echo "❌ 后端测试失败"
            exit 1
          fi
          echo "✅ 后端测试通过"

  # 前端测试作业
  frontend-tests:
    name: 前端测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 安装依赖
        run: |
          cd frontend
          corepack enable
          pnpm install
      
      - name: 运行前端测试
        run: |
          echo "🧪 运行前端测试..."
          cd frontend
          pnpm test:unit
          if [ $? -ne 0 ]; then
            echo "❌ 前端测试失败"
            exit 1
          fi
          echo "✅ 前端测试通过"

  # 构建验证作业
  build-verification:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 验证后端构建
        run: |
          echo "🔨 验证后端构建..."
          docker compose up -d
          docker exec alkaid-backend composer install --optimize-autoloader --no-dev
          if [ $? -ne 0 ]; then
            echo "❌ 后端构建验证失败"
            exit 1
          fi
          echo "✅ 后端构建验证通过"
      
      - name: 验证前端构建
        run: |
          echo "🔨 验证前端构建..."
          cd frontend
          corepack enable
          pnpm install
          pnpm build
          if [ $? -ne 0 ]; then
            echo "❌ 前端构建验证失败"
            exit 1
          fi
          echo "✅ 前端构建验证通过"

  # PR检查作业
  pr-validation:
    name: PR检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 检查PR描述
        run: |
          echo "📋 检查PR描述..."
          PR_BODY="${{ github.event.pull_request.body }}"
          if [ -z "$PR_BODY" ]; then
            echo "❌ PR必须包含描述"
            exit 1
          fi
          
          # 检查是否包含任务编号
          if [[ ! "$PR_BODY" =~ T-[0-9]+ ]]; then
            echo "⚠️  建议PR描述包含任务编号 (T-XXX)"
          fi
          
          echo "✅ PR描述检查通过"
      
      - name: 检查PR大小
        run: |
          echo "📏 检查PR大小..."
          # 获取PR变更的文件数量
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | wc -l)
          if [ "$CHANGED_FILES" -gt 50 ]; then
            echo "⚠️  PR包含较多文件 ($CHANGED_FILES)，建议拆分为更小的PR"
          fi
          echo "✅ PR大小检查完成"

  # 通知作业
  notification:
    name: 结果通知
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, backend-tests, frontend-tests, build-verification]
    if: always()
    
    steps:
      - name: 发送通知
        run: |
          echo "📢 发送构建结果通知..."
          
          # 检查所有前置作业的状态
          if [ "${{ needs.code-quality.result }}" == "failure" ] || \
             [ "${{ needs.security-scan.result }}" == "failure" ] || \
             [ "${{ needs.backend-tests.result }}" == "failure" ] || \
             [ "${{ needs.frontend-tests.result }}" == "failure" ] || \
             [ "${{ needs.build-verification.result }}" == "failure" ]; then
            echo "❌ 构建或测试失败"
            # 这里可以集成Slack、邮件等通知
            exit 1
          fi
          
          echo "✅ 所有检查通过"