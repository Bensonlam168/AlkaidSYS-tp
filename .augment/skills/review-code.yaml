# Skill: 代码审查
# 用于执行系统化的代码审查流程

name: review-code
version: 1.0.0
status: stable
description: 执行系统化的代码审查，包括架构、规范、安全、性能和测试覆盖率检查

# 工具使用约定
tooling:
  must:
    - serena
    - sequential-thinking
  should:
    - context7
    - exa
    - web

# 输入参数
parameters:
  - name: target
    type: string
    required: true
    description: 审查目标（文件路径、目录路径或模块名称）
    example: app/controller/ApiController.php

  - name: scope
    type: string
    required: false
    default: full
    description: 审查范围
    allowed_values:
      - full          # 全面审查（所有维度）
      - architecture  # 仅架构审查
      - security      # 仅安全审查
      - performance   # 仅性能审查
      - standards     # 仅规范审查
      - testing       # 仅测试审查
    example: full

  - name: severity_filter
    type: string
    required: false
    default: all
    description: 问题严重程度过滤
    allowed_values:
      - all    # 所有问题
      - P0     # 仅 P0 问题
      - P0-P1  # P0 和 P1 问题
    example: all

  - name: output_format
    type: string
    required: false
    default: markdown
    description: 报告输出格式
    allowed_values:
      - markdown  # Markdown 格式
      - json      # JSON 格式
      - html      # HTML 格式
    example: markdown

  - name: include_suggestions
    type: boolean
    required: false
    default: true
    description: 是否包含改进建议和示例代码

# 执行步骤
steps:
  - name: prepare_review
    description: 准备审查
    actions:
      - 使用 codebase-retrieval 获取目标代码
      - 读取相关设计文档和技术规范
      - 了解业务背景和需求
      - 准备审查清单

  - name: architecture_review
    description: 架构审查（如果在范围内）
    actions:
      - 检查 DDD 分层架构遵守情况
      - 验证依赖方向（Domain 不依赖 Infrastructure）
      - 检查接口和抽象使用
      - 评估模块耦合度
      - 记录架构问题
    condition: scope = full 或 architecture

  - name: standards_review
    description: 代码规范审查（如果在范围内）
    actions:
      - 检查 PSR-12 规范遵守情况
      - 验证命名规范（类、方法、变量）
      - 检查注释质量（PHPDoc、中英文双语）
      - 评估代码可读性
      - 记录规范问题
    condition: scope = full 或 standards

  - name: security_review
    description: 安全审查（如果在范围内）
    actions:
      - 检查 SQL 注入风险
      - 检查 XSS 风险
      - 验证权限控制（认证、授权）
      - 检查敏感数据保护
      - 验证多租户隔离（tenant_id）
      - 检查错误信息泄露
      - 记录安全问题
    condition: scope = full 或 security

  - name: performance_review
    description: 性能审查（如果在范围内）
    actions:
      - 检查 N+1 查询问题
      - 评估缓存使用策略
      - 检查算法复杂度
      - 评估数据库索引使用
      - 识别性能瓶颈
      - 记录性能问题
    condition: scope = full 或 performance

  - name: testing_review
    description: 测试覆盖率审查（如果在范围内）
    actions:
      - 检查是否有单元测试
      - 验证测试覆盖关键路径
      - 检查边界情况测试
      - 评估测试质量
      - 记录测试问题
    condition: scope = full 或 testing

  - name: analyze_issues
    description: 分析问题
    actions:
      - 汇总所有发现的问题
      - 评估问题严重程度（P0/P1/P2/P3）
      - 分析问题影响范围
      - 识别问题模式和根本原因

  - name: generate_suggestions
    description: 生成改进建议（如果需要）
    actions:
      - 为每个问题提供具体的改进建议
      - 提供示例代码
      - 说明修改的影响和风险
      - 提供最佳实践参考
    condition: include_suggestions = true

  - name: generate_report
    description: 生成审查报告
    actions:
      - 按照指定格式生成报告
      - 包含审查摘要（总体评分、关键发现）
      - 包含问题清单（按优先级分类）
      - 包含详细分析（位置、原因、影响）
      - 包含改进建议（方案、示例）
      - 保存报告到指定位置

# 输出
outputs:
  - review_report: 审查报告路径
  - issues_count: 发现的问题数量（按严重程度分类）
  - overall_score: 总体评分（0-100）
  - critical_issues: 关键问题列表
  - recommendations: 改进建议列表

# 使用示例
examples:
  - description: 全面审查 API 控制器
    command: |
      auggie --print "使用 review-code skill 全面审查 app/controller/ApiController.php"

  - description: 仅进行安全审查
    command: |
      auggie --print "使用 review-code skill 对 app/middleware/Auth.php 进行安全审查"

  - description: 审查整个低代码模块
    config: |
      target: domain/Lowcode
      scope: full
      severity_filter: P0-P1
      output_format: markdown
      include_suggestions: true

  - description: 快速性能审查
    config: |
      target: app/controller/LowcodeController.php
      scope: performance
      severity_filter: all
      include_suggestions: true

# 审查清单
review_checklist:
  architecture:
    - DDD 分层架构遵守情况
    - 依赖方向正确性
    - 接口和抽象使用
    - 模块耦合度
    - 单一职责原则
    - 开闭原则
  
  standards:
    - PSR-12 规范遵守
    - 命名规范（PascalCase、camelCase、snake_case）
    - PHPDoc 注释完整性
    - 中英文双语注释
    - 代码可读性
    - 代码一致性
  
  security:
    - SQL 注入防护（参数化查询）
    - XSS 防护（输出转义）
    - 认证检查
    - 授权检查
    - 敏感数据保护（加密、脱敏）
    - 多租户隔离（tenant_id 过滤）
    - 错误信息安全
    - CSRF 防护
  
  performance:
    - N+1 查询检测
    - 缓存使用策略
    - 算法复杂度
    - 数据库索引
    - 批量操作优化
    - 内存使用
    - 响应时间
  
  testing:
    - 单元测试存在性
    - 测试覆盖率
    - 边界情况测试
    - 异常路径测试
    - 集成测试
    - 测试质量
  
  best_practices:
    - SOLID 原则
    - 设计模式使用
    - 代码复用
    - 错误处理
    - 日志记录
    - 配置管理

# 评分标准
scoring_criteria:
  architecture: 25  # 架构占 25%
  standards: 20     # 规范占 20%
  security: 25      # 安全占 25%
  performance: 15   # 性能占 15%
  testing: 15       # 测试占 15%

# 问题严重程度定义
severity_levels:
  P0:
    description: 阻塞性问题，必须立即修复
    examples:
      - SQL 注入漏洞
      - 权限绕过漏洞
      - 数据泄露风险
      - 严重性能问题
  
  P1:
    description: 高优先级问题，应尽快修复
    examples:
      - 架构违反
      - 安全隐患
      - 明显性能问题
      - 缺少关键测试
  
  P2:
    description: 中优先级问题，应该修复
    examples:
      - 代码规范违反
      - 注释不完整
      - 轻微性能问题
      - 测试覆盖不足
  
  P3:
    description: 低优先级问题，可以优化
    examples:
      - 代码风格问题
      - 命名不够清晰
      - 可读性改进
      - 代码复用机会

# 依赖的文件和服务
dependencies:
  - docs/technical-specs/code-style/php-coding-standards.md
  - docs/technical-specs/api/api-specification.md
  - docs/technical-specs/security/security-guidelines.md
  - design/01-architecture-design/02-architecture-design.md
  - .augment/rules/always-alkaidsys-project-rules.md

# 错误处理
error_handling:
  - 目标文件不存在：提示检查路径
  - 无法读取文件：检查权限
  - 审查范围无效：列出有效的范围选项
  - 报告生成失败：检查输出路径权限

# 注意事项
notes:
  - 审查应基于项目的设计文档和技术规范
  - 必须区分 Phase 1（当前实现）和 Phase 2（目标架构）
  - 对于已知的技术债务，应在报告中明确标注
  - 改进建议应考虑向后兼容性和迁移成本
  - 审查报告应保存到 docs/report/ 目录
  - 建议定期对关键模块进行审查
