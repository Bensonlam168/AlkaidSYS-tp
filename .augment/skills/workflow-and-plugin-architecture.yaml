# Skill: 工作流引擎与插件系统架构指南

name: workflow-and-plugin-architecture
version: 1.0.0
status: beta
description: "帮助实现 Backlog 中工作流引擎与插件系统相关 P0 任务的架构与落地指南"

# 工具使用约定
tooling:
  must:
    - serena
    - sequential-thinking
  should:
    - context7
    - web

references:
  - design/09-lowcode-framework/47-workflow-backend-engine.md
  - backend-implementation-vs-design-analysis.md
  - docs/todo/development-backlog-2025-11-23.md

sections:
  - title: "工作流引擎核心组件"
    points:
      - "节点模型（Node）、流程定义（WorkflowDefinition）、实例（WorkflowInstance）与执行上下文"
      - "执行引擎需支持顺序/并行/条件节点，并考虑多租户与权限约束"
      - "持久化表结构必须通过 Migration 实现，遵守 tenant_id/site_id 规则"

  - title: "插件系统与 Hook 机制"
    points:
      - "插件基类与 PluginManager 负责插件生命周期：安装、启用、停用、卸载"
      - "通过事件或 Hook 系统扩展核心行为，避免在业务代码中硬编码插件逻辑"
      - "插件代码应与多租户、权限、安全规范兼容，不得绕过统一中间件"

  - title: "与低代码框架的关系"
    points:
      - "工作流定义与表单/Collection Schema 之间需有清晰的绑定关系"
      - "插件可以扩展低代码能力（如新增字段类型/校验规则），但必须通过受控扩展点"

usage:
  - description: "在启动 Workflow Engine 或 Plugin System 实施前，先通读本技能与相关设计文档，并用 Serena 总结最小可行子集"
