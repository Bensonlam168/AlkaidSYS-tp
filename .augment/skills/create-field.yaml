# Skill: 为现有 Collection 添加新字段
# 用于快速为已存在的 Collection 添加新字段

name: create-field
version: 1.0.0
status: stable
description: 为现有 Collection 添加新字段，包括数据库迁移、Schema 更新和测试

# 工具使用约定
# - 必须：Serena（思考/总结类工具）、Sequential thinking（分步推理与计划）
# - 建议：context7（代码检索）、exa（目录浏览）、web（外部文档，只作为补充）
tooling:
  must:
    - serena
    - sequential-thinking
  should:
    - context7
    - exa
    - web


# 输入参数
parameters:
  - name: collection_name
    type: string
    required: true
    description: Collection 名称（如：Product、Order）
    example: Product

  - name: field_name
    type: string
    required: true
    description: 字段名称（snake_case）
    example: description

  - name: field_type
    type: string
    required: true
    description: 字段类型
    allowed_values:
      - string      # 短文本
      - text        # 长文本
      - integer     # 整数
      - decimal     # 小数
      - boolean     # 布尔值
      - date        # 日期
      - datetime    # 日期时间
      - select      # 下拉选择
      - multiselect # 多选
      - file        # 文件
      - image       # 图片
    example: text

  - name: title
    type: string
    required: true
    description: 字段显示标题
    example: 商品描述

  - name: required
    type: boolean
    required: false
    default: false
    description: 是否必填

  - name: default_value
    type: string
    required: false
    description: 默认值

  - name: options
    type: array
    required: false
    description: 选项列表（仅用于 select/multiselect 类型）
    example:
      - { value: 1, label: 选项1 }
      - { value: 2, label: 选项2 }

  - name: validation_rules
    type: array
    required: false
    description: 验证规则
    example:
      - max:500
      - min:10

# 执行步骤
steps:
  - name: align_design_specs
    description: 对齐设计与规范
    actions:
      - 阅读 design/**、docs/technical-specs/** 与 docs/report/design-compliance-audit-2025-12-14.md，确认字段新增不违背设计
      - 确认低代码 Schema 为单一事实来源，禁止直接在业务层新增散表/散 SQL

  - name: validate_collection
    description: 验证 Collection 是否存在
    actions:
      - 使用 codebase-retrieval 查找 Collection 定义
      - 检查 lowcode_collections 表中是否存在该 Collection
      - 验证字段名称是否已存在
      - 验证字段类型是否支持

  - name: create_migration
    description: 创建字段添加迁移
    actions:
      - 生成迁移文件：database/migrations/YYYYMMDDHHMMSS_add_{field_name}_to_{table_name}_table.php
      - 根据字段类型定义数据库字段（string、text、integer、decimal 等）
      - 添加字段约束（nullable、default、unique 等）
      - 添加索引（如果需要）

  - name: update_lowcode_schema
    description: 更新低代码 Schema
    actions:
      - 在 lowcode_fields 表中插入字段定义
      - 更新 Collection 的 schema_version
      - 设置字段属性（title、required、default_value、options 等）
      - 清除相关缓存

  - name: update_validation
    description: 更新验证规则（如果提供）
    actions:
      - 在字段定义中添加验证规则
      - 更新 API 验证器

  - name: run_migration
    description: 执行迁移
    command: docker exec -it alkaid-backend php think migrate:run
    validation:
      - 检查迁移是否成功执行
      - 验证字段是否已添加到数据库表
      - 验证字段属性是否正确

  - name: create_test
    description: 创建或更新测试用例
    actions:
      - 更新 tests/Unit/Lowcode/Collection/{CollectionName}Test.php
      - 添加字段创建测试
      - 添加字段验证测试
      - 测试默认值和约束

  - name: run_tests
    description: 运行测试验证
    command: docker exec -it alkaid-backend php think test tests/Unit/Lowcode/Collection/{CollectionName}Test.php

# 输出
outputs:
  - migration_file: database/migrations/YYYYMMDDHHMMSS_add_{field_name}_to_{table_name}_table.php
  - field_id: 新创建的字段 ID
  - updated_schema: Collection Schema 已更新
  - success_message: "字段 {field_name} 已成功添加到 Collection {collection_name}"

# 使用示例
examples:
  - description: 为 Product Collection 添加 description 字段
    command: |
      auggie --print "使用 create-field skill 为 Product Collection 添加 description 字段，
      类型为 text，标题为'商品描述'，非必填"

  - description: 添加带选项的 select 字段
    command: |
      auggie --print "使用 create-field skill 为 Product Collection 添加 status 字段，
      类型为 select，标题为'状态'，选项：上架(1)、下架(0)"

  - description: 添加带验证规则的字段
    config: |
      collection_name: Product
      field_name: description
      field_type: text
      title: 商品描述
      required: false
      validation_rules:
        - max:1000
        - min:10

# 依赖的文件和服务
dependencies:
  - Infrastructure\Lowcode\Collection\Service\CollectionManager
  - Infrastructure\Lowcode\Field\Service\FieldManager
  - Infrastructure\Schema\SchemaBuilder
  - Domain\Lowcode\Collection\Interfaces\CollectionInterface
  - Domain\Lowcode\Field\Interfaces\FieldInterface

# 错误处理
error_handling:
  - Collection 不存在：提示用户检查 Collection 名称
  - 字段名称已存在：提示用户选择其他名称或更新现有字段
  - 字段类型不支持：列出支持的字段类型
  - 数据库迁移失败：回滚并提示错误信息
  - 验证规则无效：提示正确的验证规则格式

# 注意事项
notes:
  - 所有字段都会自动包含多租户隔离（tenant_id）
  - 字段名称必须使用 snake_case
  - 对于 select/multiselect 类型，必须提供 options 参数
  - 添加字段后需要清除相关缓存
  - 建议在添加字段前备份数据库
