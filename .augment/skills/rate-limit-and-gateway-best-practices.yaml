# Skill: 限流与网关最佳实践（RateLimit + Redis Token Bucket + Nginx）

name: rate-limit-and-gateway-best-practices
version: 1.0.0
status: stable
description: "AlkaidSYS 限流与网关相关最佳实践，覆盖 RateLimit 中间件、Redis 令牌桶与 Nginx 网关接入"

# 工具使用约定
tooling:
  must:
    - serena
    - sequential-thinking
  should:
    - context7
    - web

parameters:
  - name: phase
    type: string
    required: false
    default: phase1
    description: "当前限流实现阶段：phase1=固定窗口，phase2=令牌桶"

references:
  - design/03-data-layer/10-api-design.md
  - design/04-security-performance/11-security-design.md
  - docs/todo/development-backlog-2025-11-23.md

sections:
  - title: "Phase 1 固定窗口实现"
    points:
      - "当前 RateLimit 中间件使用 Redis 自增 + 过期时间实现固定时间窗口计数"
      - "在未完成 Phase 2 前，不得随意更改现有限流算法行为"

  - title: "Phase 2 Redis 令牌桶设计要点"
    points:
      - "基于 Redis 实现 Token Bucket，支持全局与路由级策略"
      - "限流 key 设计需包含 user/tenant/ip/route 等维度，遵守多租户规则"
      - "错误响应使用 HTTP 429 + Retry-After，JSON 体需包含 trace_id 与统一错误结构"

  - title: "Nginx 网关与应用层限流分工"
    points:
      - "优先在 Nginx/网关层实现粗粒度限流，在应用层补充细粒度、业务感知限流"
      - "AccessLog 与 RateLimit 指标需完整记录 trace_id、user_id、tenant_id 等信息"

usage:
  - description: "在实现或改造限流逻辑前，根据 phase 参数确认当前处于哪一阶段，并按对应要点设计实现"
  - description: "在验证 stage/prod 环境 Nginx 接入与限流/访问日志时，将本技能与部署文档一并使用"
