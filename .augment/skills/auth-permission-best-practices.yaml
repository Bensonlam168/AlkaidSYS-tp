# Skill: 认证与授权最佳实践（Auth + Permission + Casbin + 多租户）

name: auth-permission-best-practices
version: 1.0.0
status: stable
description: "AlkaidSYS 认证与授权领域最佳实践汇总，覆盖 JWT、PermissionService、RBAC/Casbin 与多租户安全"

# 工具使用约定
tooling:
  must:
    - serena
    - sequential-thinking
  should:
    - context7
    - web

references:
  - .augment/rules/always-alkaidsys-project-rules.md
  - design/04-security-performance/11-security-design.md
  - docs/report/vben-permission-integration-decision.md

sections:
  - title: "JWT 双 Token 与黑名单"
    points:
      - "统一使用 Access Token + Refresh Token，iss 必须等于环境变量 JWT_ISSUER"
      - "Refresh Token 每次刷新必须轮换，并将旧 Token 加入黑名单"
      - "任何业务代码不得绕过统一 JwtService 自行解析 JWT"

  - title: "权限码规范与映射"
    points:
      - "数据库内部权限 slug 使用 resource.action，如 forms.view"
      - "对前端返回的权限码使用 resource:action，如 forms:view"
      - "路由中间件参数使用内部 slug，API 响应使用外部 code，不得引入第三种编码体系"

  - title: "PermissionService 抽象与 Phase 规划"
    points:
      - "所有授权决策必须通过 PermissionService 等统一抽象，不得在控制器中直接查表判断权限"
      - "Phase 1 允许基于 DB RBAC 实现 PermissionService；Phase 2 在内部接入 Casbin，不改变对外接口"
      - "在 Phase 2 期间可短期双读（DB+Casbin）并比对差异，确保行为兼容"

  - title: "多租户安全约定"
    points:
      - "所有权限判断都必须考虑 tenant_id（必要时 site_id），不得跨租户泄露权限信息"
      - "PermissionService 在多租户环境下需要将租户维度纳入策略（如 Casbin 域）"

usage:
  - description: "在实现 PermissionService 或调整权限相关中间件前，先阅读本技能并用 Serena 总结适用约束"
  - description: "在处理 Casbin 集成、前后端权限集成任务时，将本技能与相关设计文档一并加载到上下文"
