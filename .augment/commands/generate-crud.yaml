# Auggie Command: 生成 CRUD 代码
# 基于 Collection 自动生成完整的 CRUD 代码（控制器、路由、测试）

name: generate-crud
version: 1.0.0
status: stable
description: 基于已存在的 Collection 自动生成完整的 CRUD 代码，包括控制器、路由、验证器和测试

# 工具使用约定
# - 必须：Serena（思考/总结类工具）、Sequential thinking（分步推理与计划）
# - 建议：context7（代码检索）、exa（目录浏览）、web（外部文档，只作为补充）
tooling:
  must:
    - serena
    - sequential-thinking
  should:
    - context7
    - exa
    - web


# 命令别名
aliases:
  - gen-crud
  - crud

# 命令参数
parameters:
  - name: collection_name
    type: string
    required: true
    description: Collection 名称
    example: Product

  - name: api_version
    type: string
    required: false
    default: v1
    description: API 版本

  - name: with_validation
    type: boolean
    required: false
    default: true
    description: 是否生成验证器

  - name: with_tests
    type: boolean
    required: false
    default: true
    description: 是否生成测试用例

  - name: with_docs
    type: boolean
    required: false
    default: true
    description: 是否生成 API 文档

# 执行步骤
steps:
  - name: load_collection
    description: 加载 Collection 定义
    actions:
      - 从数据库加载 Collection 元数据
      - 获取字段定义
      - 获取关系定义
    on_error: 提示 Collection 不存在

  - name: generate_controller
    description: 生成控制器
    actions:
      - 创建文件：app/controller/lowcode/{CollectionName}Controller.php
      - 实现 CRUD 方法：index, show, store, update, destroy
      - 添加分页、排序、过滤支持
      - 添加关系数据加载
    template: |
      <?php

      declare(strict_types=1);

      namespace app\controller\lowcode;

      use app\controller\ApiController;
      use app\Request;
      use think\Response;
      use Infrastructure\Lowcode\Collection\Service\CollectionDataManager;

      /**
       * {CollectionName} CRUD Controller | {CollectionName} CRUD控制器
       *
       * Auto-generated by AlkaidSYS CRUD Generator
       * 由 AlkaidSYS CRUD 生成器自动生成
       *
       * @package app\controller\lowcode
       */
      class {CollectionName}Controller extends ApiController
      {
          protected CollectionDataManager $dataManager;
          protected string $collectionName = '{collection_name}';

          public function __construct()
          {
              parent::__construct();
              $this->dataManager = app(CollectionDataManager::class);
          }

          /**
           * List {collection_name} | 列表查询
           *
           * @param Request $request
           * @return Response
           */
          public function index(Request $request): Response
          {
              $params = $request->only(['page', 'limit', 'sort', 'order', 'filter']);

              $data = $this->dataManager->list(
                  $this->collectionName,
                  $params,
                  $request->tenantId(),
                  $request->siteId()
              );

              return $this->success($data);
          }

          // ... 其他 CRUD 方法
      }

  - name: generate_routes
    description: 生成路由
    actions:
      - 在 route/lowcode.php 中添加路由组
      - 配置中间件（auth, permission）
      - 支持 RESTful 路由

  - name: generate_validator
    description: 生成验证器
    condition: with_validation == true
    actions:
      - 基于 Collection 字段生成验证规则
      - 创建文件：app/validate/lowcode/{CollectionName}Validate.php

  - name: generate_tests
    description: 生成测试用例
    condition: with_tests == true
    actions:
      - 创建文件：tests/Feature/Lowcode/{CollectionName}CrudTest.php
      - 测试所有 CRUD 操作
      - 测试数据验证
      - 测试权限控制

  - name: generate_docs
    description: 生成 API 文档
    condition: with_docs == true
    actions:
      - 生成 OpenAPI 规范
      - 更新 API 文档

# 输出
outputs:
  - controller: app/controller/lowcode/{CollectionName}Controller.php
  - routes: route/lowcode.php (已更新)
  - validator: app/validate/lowcode/{CollectionName}Validate.php (可选)
  - tests: tests/Feature/Lowcode/{CollectionName}CrudTest.php (可选)
  - docs: API 文档已更新 (可选)

# 使用示例
examples:
  - description: 为 Product Collection 生成 CRUD
    command: auggie --print "为 Product Collection 生成完整的 CRUD 代码"

  - description: 生成但不包含测试
    command: auggie --print "为 Order Collection 生成 CRUD，with_tests=false"

# 成功消息
success_message: |
  ✅ CRUD 代码生成成功！

  📁 生成的文件：
  - 控制器：app/controller/lowcode/{CollectionName}Controller.php
  - 路由：route/lowcode.php (已更新)
  - 验证器：app/validate/lowcode/{CollectionName}Validate.php
  - 测试：tests/Feature/Lowcode/{CollectionName}CrudTest.php

  🚀 下一步：
  1. 查看生成的代码
  2. 运行测试：php think test tests/Feature/Lowcode/{CollectionName}CrudTest.php
  3. 访问 API：http://localhost:8000/{api_version}/lowcode/{collection_name}

  📚 API 端点：
  - GET    /{api_version}/lowcode/{collection_name}      - 列表查询
  - GET    /{api_version}/lowcode/{collection_name}/:id  - 单条查询
  - POST   /{api_version}/lowcode/{collection_name}      - 创建
  - PUT    /{api_version}/lowcode/{collection_name}/:id  - 更新
  - DELETE /{api_version}/lowcode/{collection_name}/:id  - 删除
