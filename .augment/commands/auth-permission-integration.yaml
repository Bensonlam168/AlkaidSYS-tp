# Auggie Command: 前后端权限集成（PermissionService + /v1/auth/me + Auth Store）
# 对应 Backlog [P0] 前后端权限集成任务，统一后端权限服务与前端权限状态

name: auth-permission-integration
version: 1.0.0
status: stable
description: "实现 PermissionService + /v1/auth/me.permissions + 前端 Auth Store 集成，统一 resource:action 权限码主链路"

# 工具使用约定
# - 必须：Serena（思考/总结类工具）、Sequential thinking（分步推理与计划）
# - 建议：context7（代码检索）、exa（目录浏览）、web（外部文档，只作为补充）
tooling:
  must:
    - serena
    - sequential-thinking
  should:
    - context7
    - exa
    - web

parameters:
  - name: backend_only
    type: boolean
    required: false
    default: false
    description: "是否只执行后端集成（不修改前端 Auth Store）"

references:
  - .augment/rules/always-alkaidsys-project-rules.md
  - docs/report/vben-permission-integration-decision.md
  - design/04-security-performance/11-security-design.md
  - design/03-data-layer/10-api-design.md

steps:
  - name: read_design_and_rules
    description: "使用 Serena + context7 阅读权限集成设计、API 规范与 always 规则，列出关键约束与 Phase1/Phase2 区分"

  - name: inspect_current_backend
    description: "用 context7/exa 查找 route/auth.php、AuthController、Permission 中间件与权限相关表结构，梳理现状"

  - name: implement_permission_service
    description: "在 Domain/Infrastructure 层实现 PermissionService::getUserPermissions(int $userId): string[]，内部使用 slug=resource.action，返回值为 resource:action 数组"

  - name: extend_auth_me_endpoint
    description: "扩展 GET /v1/auth/me，在 data 中增加 permissions: string[] 字段（resource:action），同时保持错误码与 trace_id 行为符合规范"

  - name: update_frontend_auth_store
    description: "当 backend_only=false 时，更新前端 getUserInfoApi/Auth Store，使其从 /v1/auth/me 中读取 permissions 并注入 accessStore（resource:action 形式）"

  - name: add_tests_and_docs
    description: "为 PermissionService 与 /v1/auth/me.permissions 补充单元/集成测试，并更新 API 文档与权限集成说明"

outputs:
  - permission_service: app/service/PermissionService.php
  - auth_endpoint: route/auth.php & app/controller/AuthController.php
  - frontend_auth_store: frontend/apps/web-antd/src/store/auth.ts
  - tests: tests/Feature/Auth/ 与 tests/Unit/PermissionService/ 下新增用例

examples:
  - description: "为当前项目实现完整的前后端权限集成链路"
    command: "auggie --print '执行 auth-permission-integration 命令，实现 PermissionService + /v1/auth/me.permissions + 前端权限集成'"
