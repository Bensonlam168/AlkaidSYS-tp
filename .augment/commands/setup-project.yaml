# Command: 项目初始化
# 用于快速搭建 AlkaidSYS 开发环境

name: setup-project
version: 1.0.0
status: beta
description: 初始化 AlkaidSYS 项目开发环境，包括依赖安装、数据库配置、环境设置等

# 工具使用约定
# - 必须：Serena（思考/总结类工具）、Sequential thinking（分步推理与计划）
# - 建议：context7（代码检索）、exa（目录浏览）、web（外部文档，只作为补充）
tooling:
  must:
    - serena
    - sequential-thinking
  should:
    - context7
    - exa
    - web


# 输入参数
parameters:
  - name: environment
    type: string
    required: false
    default: development
    description: 环境类型
    allowed_values:
      - development  # 开发环境
      - testing      # 测试环境
      - staging      # 预发布环境
      - production   # 生产环境
    example: development

  - name: with_sample_data
    type: boolean
    required: false
    default: true
    description: 是否填充示例数据

  - name: skip_frontend
    type: boolean
    required: false
    default: false
    description: 是否跳过前端环境设置

  - name: database_host
    type: string
    required: false
    default: localhost
    description: 数据库主机地址

  - name: database_name
    type: string
    required: false
    default: alkaidsys
    description: 数据库名称

  - name: redis_host
    type: string
    required: false
    default: localhost
    description: Redis 主机地址

# 执行步骤
steps:
  - name: check_requirements
    description: 检查系统要求
    actions:
      - 检查 PHP 版本（>= 8.2）
      - 检查 Composer 是否安装
      - 检查 Node.js 版本（>= 18）
      - 检查 MySQL 版本（>= 8.0）
      - 检查 Redis 是否可用
      - 检查必需的 PHP 扩展（swoole、redis、pdo_mysql 等）

  - name: copy_env_file
    description: 复制环境配置文件
    actions:
      - 复制 .env.example 到 .env
      - 根据参数更新数据库配置
      - 更新 Redis 配置
      - 设置应用密钥
      - 配置日志级别
    command: cp .env.example .env

  - name: install_backend_dependencies
    description: 安装后端依赖
    actions:
      - 运行 Composer 安装
      - 验证依赖完整性
      - 优化自动加载
    command: docker exec -it alkaid-backend composer install --optimize-autoloader

  - name: install_frontend_dependencies
    description: 安装前端依赖（如果不跳过）
    actions:
      - 进入前端目录
      - 运行 npm 或 pnpm 安装
      - 验证依赖完整性
    command: cd frontend && pnpm install
    condition: 仅在 skip_frontend=false 时执行

  - name: generate_app_key
    description: 生成应用密钥
    actions:
      - 生成随机应用密钥
      - 更新 .env 文件
    command: php think key:generate

  - name: create_database
    description: 创建数据库
    actions:
      - 连接 MySQL 服务器
      - 创建项目数据库
      - 设置字符集为 utf8mb4
      - 创建测试数据库
    sql: |
      CREATE DATABASE IF NOT EXISTS {database_name} 
      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE DATABASE IF NOT EXISTS {database_name}_test 
      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

  - name: run_migrations
    description: 运行数据库迁移
    actions:
      - 执行所有迁移文件
      - 验证表结构
      - 检查迁移状态
    command: php think migrate:run

  - name: seed_database
    description: 填充数据（如果指定）
    actions:
      - 运行数据填充器
      - 创建默认管理员账户
      - 创建示例数据
      - 验证数据完整性
    command: php think seed:run
    condition: 仅在 with_sample_data=true 时执行

  - name: setup_storage
    description: 设置存储目录
    actions:
      - 创建必要的存储目录
      - 设置目录权限
      - 创建符号链接
    commands:
      - mkdir -p runtime/log runtime/cache runtime/temp
      - chmod -R 755 runtime
      - docker exec -it alkaid-backend php think storage:link

  - name: clear_cache
    description: 清除缓存
    actions:
      - 清除配置缓存
      - 清除路由缓存
      - 清除视图缓存
    command: docker exec -it alkaid-backend php think cache:clear

  - name: build_frontend
    description: 构建前端（开发模式，如果不跳过）
    actions:
      - 进入前端目录
      - 运行开发构建
    command: cd frontend && pnpm dev
    condition: 仅在 skip_frontend=false 且 environment=development 时执行

  - name: verify_installation
    description: 验证安装
    actions:
      - 检查数据库连接
      - 检查 Redis 连接
      - 验证路由配置
      - 测试基本 API 端点
      - 生成安装报告

# 输出
outputs:
  - installation_status: 安装状态（成功/失败）
  - database_info: 数据库配置信息
  - admin_credentials: 管理员账户信息（如果创建）
  - application_url: 应用访问地址
  - api_url: API 访问地址
  - installation_report: 安装报告路径

# 使用示例
examples:
  - description: 初始化开发环境（带示例数据）
    command: |
      auggie --print "使用 setup-project command 初始化开发环境，包含示例数据"

  - description: 初始化生产环境（不含示例数据）
    command: |
      auggie --print "使用 setup-project command 初始化生产环境，不包含示例数据"

  - description: 自定义数据库配置
    config: |
      environment: development
      with_sample_data: true
      database_host: 192.168.1.100
      database_name: alkaidsys_dev
      redis_host: 192.168.1.101

# 默认管理员账户
default_admin:
  username: admin
  email: admin@alkaidsys.com
  password: Admin@123456  # 首次登录后需修改

# 依赖的文件和服务
dependencies:
  - .env.example 文件
  - composer.json
  - package.json（前端）
  - database/migrations/ 目录
  - database/seeds/ 目录

# 错误处理
error_handling:
  - PHP 版本不符：提示升级 PHP
  - Composer 未安装：提供安装指南
  - 数据库连接失败：检查数据库配置和服务状态
  - 依赖安装失败：检查网络连接和镜像源
  - 迁移失败：显示详细错误并提供回滚选项
  - 权限不足：提示需要的文件系统权限

# 注意事项
notes:
  - 首次运行需要确保 MySQL 和 Redis 服务已启动
  - 生产环境部署前请修改默认管理员密码
  - 建议使用 .env 文件管理敏感配置
  - 前端开发服务器默认运行在 http://localhost:5173
  - 后端 API 默认运行在 http://localhost:8000
  - 确保 runtime 目录有写入权限
  - 生产环境建议禁用调试模式

# 安装后步骤
post_installation:
  - 访问应用首页验证安装
  - 登录管理后台
  - 修改默认管理员密码
  - 配置邮件服务
  - 配置文件存储
  - 设置定时任务
  - 配置队列服务
  - 阅读开发文档

# 故障排除
troubleshooting:
  - 数据库连接失败：检查 .env 中的数据库配置
  - Redis 连接失败：确认 Redis 服务已启动
  - 权限错误：运行 chmod -R 755 runtime
  - 前端构建失败：删除 node_modules 重新安装
  - 迁移失败：检查数据库用户权限
